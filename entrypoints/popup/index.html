<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Extension Popup</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #12122a;
      font-family: system-ui, sans-serif;
      width: 200px;
    }

    #app {
      padding: 2px 4px;
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .dock-sep {
      width: 1px;
      height: 48px;
      background: rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
    }

    .dock-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      padding: 8px 5px;
      border-radius: 10px;
      background: transparent;
      border: none;
      transition: background 0.15s ease;
      flex: 1;
    }

    .dock-btn:hover {
      background: rgba(255, 255, 255, 0.07);
    }

    .dock-btn:active {
      background: rgba(255, 255, 255, 0.12);
      transform: scale(0.97);
    }

    .dock-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dock-label {
      font-size: 10px;
      color: #8888aa;
      white-space: nowrap;
      letter-spacing: 0.02em;
    }
  </style>
</head>

<body>
  <div id="app">

    <button id="open-text-pad" class="dock-btn">
      <div class="dock-icon" style="background: #3a1a3a;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c084fc" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
        </svg>
      </div>
      <span class="dock-label">Text<br>pad</span>
    </button>

    <div class="dock-sep"></div>

    <!-- Open book: two flat pages with a curved spine at the bottom -->
    <button id="dictionary-explorer" class="dock-btn">
      <div class="dock-icon" style="background: #1a3a2a;">
        <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <!-- Left page: a quadrilateral page lying flat -->
          <path d="M12 6 C9 5, 5 5, 3 6 L3 18 C5 17, 9 17, 12 18 Z" fill="#4ade80" fill-opacity="0.15"
            stroke="#4ade80" />
          <!-- Right page -->
          <path d="M12 6 C15 5, 19 5, 21 6 L21 18 C19 17, 15 17, 12 18 Z" fill="#4ade80" fill-opacity="0.15"
            stroke="#4ade80" />
          <!-- Spine curve at bottom -->
          <path d="M12 18 C12 19.5, 12 19.5, 12 18" stroke="#4ade80" />
          <!-- Text lines on left page -->
          <line x1="5.5" y1="9.5" x2="10" y2="9" stroke="#4ade80" stroke-width="1.2" opacity="0.7" />
          <line x1="5.5" y1="12" x2="10" y2="11.5" stroke="#4ade80" stroke-width="1.2" opacity="0.7" />
          <line x1="5.5" y1="14.5" x2="10" y2="14" stroke="#4ade80" stroke-width="1.2" opacity="0.7" />
          <!-- Text lines on right page -->
          <line x1="14" y1="9" x2="18.5" y2="9.5" stroke="#4ade80" stroke-width="1.2" opacity="0.7" />
          <line x1="14" y1="11.5" x2="18.5" y2="12" stroke="#4ade80" stroke-width="1.2" opacity="0.7" />
          <line x1="14" y1="14" x2="18.5" y2="14.5" stroke="#4ade80" stroke-width="1.2" opacity="0.7" />
        </svg>
      </div>
      <span class="dock-label">Dictionary<br>Explorer</span>
    </button>

    <div class="dock-sep"></div>



    <button id="open-sidebar" class="dock-btn">
      <div class="dock-icon" style="background: #1e3a5f;">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="2" width="18" height="16" rx="2.5" stroke="#60a5fa" stroke-width="1.5" />
          <line x1="13" y1="2" x2="13" y2="18" stroke="#60a5fa" stroke-width="1.5" />
          <rect x="13.75" y="2.75" width="4.5" height="14.5" rx="1" fill="#60a5fa" opacity="0.25" />
        </svg>
      </div>
      <span class="dock-label">Sidebar<br>Dictionary</span>
    </button>





  </div>
  <script type="module" src="./main.ts"></script>
</body>

</html>

</html>

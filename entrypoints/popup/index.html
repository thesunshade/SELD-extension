<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sinhala-English Learner's Dictionary (experimental)</title>

</head>

<body>
  <div id="app">

    <button id="open-library" class="dock-btn">
      <div class="dock-icon squircle" style="background: #4a3310;">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24">
          <title xmlns="">school-outline-rounded</title>
          <path fill="#fbbf24"
            d="M6.839 15.89q-.385-.217-.612-.59Q6 14.926 6 14.462v-3.877l-1.592-.883q-.218-.13-.324-.308T3.98 9t.106-.394t.323-.308l6.82-3.72q.182-.101.371-.144t.4-.044t.401.044t.372.143l7.721 4.187q.212.125.32.313q.109.189.109.408v5.4q0 .212-.144.356t-.356.144t-.357-.144t-.143-.356V9.562L18 10.585v3.877q0 .464-.227.838t-.611.59l-4.385 2.374q-.186.105-.376.149t-.401.043t-.401-.043t-.376-.15zm4.93-3.305q.135.076.24.076q.106 0 .241-.076L18.83 9l-6.58-3.565q-.134-.077-.24-.077t-.24.077L5.17 9zm-.019 4.832q.135.077.25.077t.25-.077l4.462-2.411q.154-.096.22-.221t.068-.318v-3.332l-4.217 2.302q-.187.105-.38.149q-.191.043-.403.043t-.404-.043t-.379-.15L7 11.136v3.332q0 .154.067.299q.067.144.221.24zM12 14.36" />
        </svg>
      </div>
      <span class="dock-label">The<br>Library</span>
    </button>

    <div class="dock-sep"></div>

    <button id="open-text-pad" class="dock-btn">
      <div class="dock-icon squircle" style="background: #3a1a3a;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c084fc" strokeWidth="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
        </svg>
      </div>
      <span class="dock-label">Text<br>pad</span>
    </button>

    <div class="dock-sep"></div>

    <!-- Open book: two flat pages with a curved spine at the bottom -->
    <button id="dictionary-explorer" class="dock-btn">
      <div class="dock-icon squircle" style="background: #1a3a2a;">
        <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#4ade80" strokeWidth="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <path
            d="M12 6C12 6 13.6875 5 16.5 5C19.3125 5 21 6 21 6V19C21 19 19.3125 18 16.5 18C13.6875 18 12 19 12 19V6Z"
            fill="#4ade80" fill-opacity="0.15" stroke-miterlimit="10" />
          <path d="M3 6C3 6 4.6875 5 7.5 5C10.3125 5 12 6 12 6V19C12 19 10.3125 18 7.5 18C4.6875 18 3 19 3 19V6Z"
            fill="#4ade80" fill-opacity="0.15" stroke-miterlimit="10" />
        </svg>
      </div>
      <span class="dock-label">Dictionary<br>Explorer</span>
    </button>

    <div class="dock-sep"></div>

    <button id="open-sidebar" class="dock-btn">
      <div class="dock-icon squircle" style="background: #1e3a5f;">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="2" width="18" height="16" rx="2.5" stroke="#60a5fa" strokeWidth="1.5" />
          <line x1="13" y1="2" x2="13" y2="18" stroke="#60a5fa" strokeWidth="1.5" />
          <rect x="13.75" y="2.75" width="4.5" height="14.5" rx="1" fill="#60a5fa" opacity="0.25" />
        </svg>
      </div>
      <span class="dock-label">Sidebar<br>Dictionary</span>
    </button>





  </div>
  <script type="module" src="./main.ts"></script>
</body>

</html>

</html>
